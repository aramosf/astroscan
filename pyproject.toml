[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroscan"
version = "1.1.0"
description = "Authorized, evidence-oriented scanner for selected Astro vulnerabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aramosf" }]
keywords = ["astro", "security", "scanner", "bug-bounty", "pentest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
astroscan = "astro_scan:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["astro_scan"]
